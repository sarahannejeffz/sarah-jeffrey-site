<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield / Hexagon -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0c1c42" stroke="url(#blueGrad)" stroke-width="2.5" />
  <!-- Monogram SJ -->
  <g filter="url(#blueGlow)">
    <text x="32" y="41" 
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="26" 
          font-weight="800" 
          fill="url(#blueGrad)" 
          text-anchor="middle" 
          letter-spacing="-1.5">SJ</text>
  </g>
</svg>
